
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Space Explorer</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    #info {
      position: fixed;
      z-index: 10;
      top: 15px;
      left: 15px;
      right: 15px;
      padding: 15px;
      background: #101020;
      color: white;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="info">🚀 AR SPACE EXPLORER — Scan the target!</div>

<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
    <a-entity
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .planet">
    </a-entity>
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Sun -->
    <a-sphere
      position="0 0 0.3"
      radius="0.22"
      color="#FFD700"
      material="emissive: #FF9900; emissiveIntensity: 0.8">
    </a-sphere>

    <!-- Planet 1 -->
    <a-sphere
      class="planet"
      position="-0.45 0.35 0.3"
      radius="0.10"
      color="#2196F3"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
    </a-sphere>

    <!-- Planet 2 -->
    <a-sphere
      class="planet"
      position="0.48 0.25 0.3"
      radius="0.13"
      color="#FF5722"
      animation="property: rotation; to: 360 360 0; loop: true; dur: 4000">
    </a-sphere>

    <!-- Planet 3 -->
    <a-sphere
      class="planet"
      position="0 -0.48 0.3"
      radius="0.08"
      color="#9C27B0">
    </a-sphere>

    <!-- Title -->
    <a-text
      value="WELCOME TO SPACE"
      position="-0.65 0.75 0"
      color="white"
      width="2">
    </a-text>

    <a-text
      value="TAP A PLANET!"
      position="-0.4 -0.7 0"
      color="yellow"
      width="2">
    </a-text>

  </a-entity>
</a-scene>

<script>
const planets = document.querySelectorAll(".planet");

const colors = [
  "#00FFFF",
  "#FF00FF",
  "#00FF00",
  "#FFD700",
  "#FF5722"
];

planets.forEach(planet => {
  planet.addEventListener("click", () => {
    const color = colors[Math.floor(Math.random() * colors.length)];
    planet.setAttribute("color", color);
  });
});
</script>

</body>
</html>
