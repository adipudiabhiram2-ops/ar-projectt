
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch the Target</title>
<style>
body {
  margin: 0;
  background: #101020;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 { margin-top: 30px; }
#score { font-size: 24px; }
#game {
  width: 90vw;
  height: 65vh;
  margin: 20px auto;
  background: #202040;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
}
#target {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: cyan;
  position: absolute;
  cursor: pointer;
  box-shadow: 0 0 25px cyan;
  left: 40%;
  top: 40%;
}
button {
  padding: 14px 25px;
  border: 0;
  border-radius: 10px;
  background: cyan;
  font-size: 17px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🎯 CATCH THE TARGET</h1>
<div id="score">Score: 0 | Time: 30</div>

<div id="game">
  <div id="target"></div>
</div>

<button onclick="startGame()">RESTART GAME</button>

<script>
let score = 0;
let time = 30;
let playing = true;
let timer;

const target = document.getElementById("target");
const game = document.getElementById("game");
const board = document.getElementById("score");

function moveTarget() {
  const maxX = game.clientWidth - target.offsetWidth;
  const maxY = game.clientHeight - target.offsetHeight;

  target.style.left = Math.random() * maxX + "px";
  target.style.top = Math.random() * maxY + "px";
}

target.addEventListener("click", () => {
  if (!playing) return;
  score++;
  board.textContent = "Score: " + score + " | Time: " + time;
  moveTarget();
});

function startGame() {
  clearInterval(timer);
  score = 0;
  time = 30;
  playing = true;
  target.style.display = "block";
  board.textContent = "Score: 0 | Time: 30";
  moveTarget();

  timer = setInterval(() => {
    time--;
    board.textContent = "Score: " + score + " | Time: " + time;

    if (time <= 0) {
      clearInterval(timer);
      playing = false;
      target.style.display = "none";
      board.textContent = "GAME OVER! Final score: " + score;
    }
  }, 1000);
}

startGame();
</script>

</body>
</html>
