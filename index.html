
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; font-family: Arial; }

    #start {
      position: fixed;
      z-index: 100;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 35px;
      background: #00ffff;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      z-index: 100;
      top: 15px;
      left: 10px;
      color: white;
      background: black;
      padding: 10px;
    }
  </style>
</head>

<body>

<div id="status">Ready to start</div>
<button id="start">START AR</button>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0"
    look-controls="enabled: false">
    <a-cursor></a-cursor>
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-sphere
      id="ball"
      position="0 0 0.3"
      radius="0.2"
      color="cyan">
    </a-sphere>

    <a-text
      value="CATCH THE BALL!"
      position="-0.6 0.6 0"
      color="yellow"
      width="2">
    </a-text>

  </a-entity>
</a-scene>

<script>

const scene = document.querySelector("#scene");
const startButton = document.querySelector("#start");
const status = document.querySelector("#status");

let arSystem = null;

scene.addEventListener("loaded", () => {
  arSystem = scene.systems["mindar-image-system"];
  status.innerText = "Ready! Tap START AR.";
});

scene.addEventListener("arReady", () => {
  status.innerText = "Camera working! Scan the image.";
  startButton.style.display = "none";
});

scene.addEventListener("arError", () => {
  status.innerText = "AR failed to start. Check camera permissions.";
});

startButton.addEventListener("click", async () => {
  try {
    if (!arSystem) {
      status.innerText = "Loading AR system... Please wait.";
      return;
    }

    status.innerText = "Starting camera...";
    await arSystem.start();

  } catch (error) {
    status.innerText = "Error: " + error.message;
  }
});

</script>

</body>
</html>
